# Qué backend atiende cada interfaz cuando la sesión es BookOS.
#
# Esto sustituye al viejo `UseIn=` del fichero .portal, que xdg-desktop-portal
# marcó obsoleto en la 1.17: la elección la manda ahora la configuración y no
# el backend. El nombre del fichero tiene que ser `<escritorio>-portals.conf` y
# `<escritorio>` es lo que dice `DesktopNames=` en bookos.desktop.
#
# El resto va a GTK, que es quien tiene diálogo de ficheros; BookOS todavía no
# implementa FileChooser.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=bookos
org.freedesktop.impl.portal.Screenshot=bookos
# El aspecto: color-scheme, accent-color y reduced-motion. Es lo que hace que
# una app GTK o Tauri siga el tema y el acento de BookOS sin instalarle nada.
org.freedesktop.impl.portal.Settings=bookos
