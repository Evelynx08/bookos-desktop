[package]
name = "bookos-budsd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canal de control de los Galaxy Buds para la sesión BookOS"

# Todo esto ya está en el árbol del workspace (bookos-system y bookos-comp):
# no añade ninguna dependencia nueva al Cargo.lock.
[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
